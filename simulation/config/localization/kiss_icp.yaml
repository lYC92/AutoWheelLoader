kiss_icp_node:
  ros__parameters:
    use_sim_time: true
    base_frame: base_link
    lidar_odom_frame: odom
    publish_odom_tf: true
    invert_odom_tf: false
    publish_debug_clouds: false
    # Organized Gazebo clouds have no per-return timestamps. Do not invent deskew.
    data:
      deskew: false
      # Near-field crop complements scan-time articulated visual bounds.
      min_range: 3.0
      max_range: 50.0
    mapping:
      voxel_size: 0.5
      max_points_per_voxel: 20
    registration:
      max_num_threads: 2
      max_num_iterations: 100
      convergence_criterion: 0.0001
loader_localization_crop:
  ros__parameters:
    use_sim_time: true
    ground_mode: adaptive
    ground_threshold: 0.18
    self_filter: true
    body_margin: 0.10
    # Used only for ground_mode=fixed (historical baseline).
    min_z: -2.7
    min_range: 3.0
    max_range: 50.0
